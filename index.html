<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Per-route tags. These are the homepage values; scripts/prerender.mjs
       replaces everything between the seo markers for each page at build
       time, and components/Seo.tsx keeps them current while navigating.
       Values come from src/seo.ts. -->
  <!--seo:start-->
  <title>Synerax Cloud Technologies | Cloud &amp; AI Engineering</title>
  <meta name="description" content="Synerax engineers cloud platforms, agentic AI, contact centers and enterprise applications, from code to cloud." />
  <link rel="canonical" href="https://www.synerax.in/" />
  <meta property="og:site_name" content="Synerax Cloud Technologies" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Synerax Cloud Technologies | Cloud &amp; AI Engineering" />
  <meta property="og:description" content="Synerax engineers cloud platforms, agentic AI, contact centers and enterprise applications, from code to cloud." />
  <meta property="og:url" content="https://www.synerax.in/" />
  <meta property="og:image" content="https://www.synerax.in/icons/icon-512.png" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Synerax Cloud Technologies | Cloud &amp; AI Engineering" />
  <meta name="twitter:description" content="Synerax engineers cloud platforms, agentic AI, contact centers and enterprise applications, from code to cloud." />
  <meta name="twitter:image" content="https://www.synerax.in/icons/icon-512.png" />
  <!--seo:end-->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "name": "Synerax Cloud Technologies",
          "alternateName": "Synerax",
          "url": "https://www.synerax.in/"
        },
        {
          "@type": "Organization",
          "name": "Synerax Cloud Technologies",
          "url": "https://www.synerax.in/",
          "logo": "https://www.synerax.in/icons/icon-512.png"
        }
      ]
    }
  </script>
  <!-- Favicon: the team's light- and dark-mode files, used as supplied. The browser
       picks one by its colour scheme; the first link is the fallback for browsers
       that ignore `media` on icons. -->
  <link rel="icon" type="image/png" href="https://res.cloudinary.com/dtg3lepr4/image/upload/v1793255810/file_000000003248820a89cfbef7459b0960_wz01du.png" />
  <link rel="icon" type="image/png" media="(prefers-color-scheme: light)" href="https://res.cloudinary.com/dtg3lepr4/image/upload/v1793255810/file_000000003248820a89cfbef7459b0960_wz01du.png" />
  <link rel="icon" type="image/png" media="(prefers-color-scheme: dark)" href="https://res.cloudinary.com/dtg3lepr4/image/upload/v1793255865/file_0000000028e8820aaf22089b4207df3b-removebg-preview_m6j9dh.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
  <!-- Web app metadata: name, colours and install icons (public/manifest.json) -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="application-name" content="Synerax Cloud Technologies" />
  <meta name="apple-mobile-web-app-title" content="Synerax" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <meta name="theme-color" content="#ffffff">
  <script>
    /* The site is light-only. Set the theme before first paint, and clear
       the choice saved by the old dark-mode toggle so returning visitors
       who picked dark are not left on it. */
    (function () {
      document.documentElement.dataset.theme = 'light';
      document.documentElement.style.colorScheme = 'light';
      try { localStorage.removeItem('synerax-theme'); } catch (e) { /* ignore */ }
    })();
    /* Intro loader: first page of the session, motion allowed. The class
       turns on the static overlay at the top of <body> before first paint;
       the script after it runs the timeline. */
    (function () {
      try {
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        if (sessionStorage.getItem('synerax-loader-seen')) return;
        sessionStorage.setItem('synerax-loader-seen', '1');
      } catch (e) { /* storage blocked: the loader still plays */ }
      document.documentElement.classList.add('sx-loading');
    })();
  </script>
  <style>
    #site-loader { display: none; }
    html.sx-loading #site-loader { display: grid; }
    html.sx-loading { overflow: hidden; }
  </style>
</head>
<body>
  <!-- First-visit loader (styles: src/type-apply.css §7). It sits outside
       #root and is plain HTML, so it plays from the first frame without
       waiting for the JS bundle, and the prerendered page paints underneath
       it straight away. That keeps LCP on the real page instead of ~3.5s
       later. 0–1.0s logo draws · 0.8–1.8s wordmark · 1.6–2.6s tagline and
       counter · 2.6–3.5s curtains open. SiteLoader.tsx only pauses Lenis. -->
  <div id="site-loader" class="site-loader" role="presentation">
    <div class="site-loader__panel site-loader__panel--top" aria-hidden="true"></div>
    <div class="site-loader__panel site-loader__panel--bottom" aria-hidden="true"></div>
    <div class="site-loader__inner" aria-hidden="true">
      <div class="site-loader__logo">
        <svg class="site-loader__outline" viewBox="0 0 72 72" fill="none">
          <rect x="2" y="2" width="68" height="68" rx="18" pathLength="1" />
        </svg>
        <img class="site-loader__mark site-loader__mark--light" src="https://res.cloudinary.com/dtg3lepr4/image/upload/v1793255810/file_000000003248820a89cfbef7459b0960_wz01du.png" alt="Synerax" decoding="async" />
      </div>
      <span class="site-loader__word">
        <img class="site-loader__wm site-loader__wm--ink" src="/brand/synerax-wordmark-ink.png" alt="Synerax" decoding="async" />
      </span>
      <p class="site-loader__tagline">From Code to <em>Cloud.</em></p>
      <div class="site-loader__meter">
        <span class="site-loader__count">000</span>
        <span class="site-loader__bar"></span>
      </div>
    </div>
    <button type="button" class="site-loader__skip">Skip</button>
  </div>
  <script>
    (function () {
      var html = document.documentElement;
      var el = document.getElementById('site-loader');
      if (!html.classList.contains('sx-loading')) { el.parentNode.removeChild(el); return; }
      var count = el.querySelector('.site-loader__count');
      var start = performance.now(), raf = 0;
      function tick(now) {
        var t = Math.min(Math.max((now - start - 1600) / 1000, 0), 1);
        count.textContent = ('00' + Math.round(t * 100)).slice(-3);
        if (t < 1) raf = requestAnimationFrame(tick);
      }
      function finish() {
        cancelAnimationFrame(raf);
        clearTimeout(end);
        html.classList.remove('sx-loading');
        if (el.parentNode) el.parentNode.removeChild(el);
      }
      raf = requestAnimationFrame(tick);
      var end = setTimeout(finish, 3500);
      el.querySelector('.site-loader__skip').addEventListener('click', finish);
    })();
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
