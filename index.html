<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Synerax Technologies</title>
  <link rel="icon" type="image/png" sizes="64x64" href="https://res.cloudinary.com/dtg3lepr4/image/upload/w_64,h_64,c_fill,q_auto/v1783885429/favicon_synerax_vuwmga.png?v=2" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <meta name="theme-color" content="#0A0A0B">
  <script>
    /* Resolve the theme before first paint so a light-mode visitor never
       sees a flash of the dark palette. Mirrors src/hooks/useTheme.ts. */
    (function () {
      try {
        var s = localStorage.getItem('synerax-theme');
        var t = (s === 'light' || s === 'dark')
          ? s
          : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.dataset.theme = t;
        document.documentElement.style.colorScheme = t;
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
