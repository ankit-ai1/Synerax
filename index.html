<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Synerax Cloud Technologies</title>
  <!-- Site name for search results and link previews -->
  <meta property="og:site_name" content="Synerax Cloud Technologies" />
  <meta property="og:title" content="Synerax Cloud Technologies" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://synerax.in/" />
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "name": "Synerax Cloud Technologies",
          "alternateName": "Synerax",
          "url": "https://synerax.in/"
        },
        {
          "@type": "Organization",
          "name": "Synerax Cloud Technologies",
          "url": "https://synerax.in/",
          "logo": "https://synerax.in/icons/icon-512.png"
        }
      ]
    }
  </script>
  <!-- Favicon: the team's light- and dark-mode files, used as supplied. The browser
       picks one by its colour scheme; the first link is the fallback for browsers
       that ignore `media` on icons. -->
  <link rel="icon" type="image/png" href="https://res.cloudinary.com/dtg3lepr4/image/upload/v1793255810/file_000000003248820a89cfbef7459b0960_wz01du.png" />
  <link rel="icon" type="image/png" media="(prefers-color-scheme: light)" href="https://res.cloudinary.com/dtg3lepr4/image/upload/v1793255810/file_000000003248820a89cfbef7459b0960_wz01du.png" />
  <link rel="icon" type="image/png" media="(prefers-color-scheme: dark)" href="https://res.cloudinary.com/dtg3lepr4/image/upload/v1793255865/file_0000000028e8820aaf22089b4207df3b-removebg-preview_m6j9dh.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
  <!-- Web app metadata: name, colours and install icons (public/manifest.json) -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="description" content="Synerax engineers cloud platforms, agentic AI, contact centers and enterprise applications — from code to cloud, engineered to last." />
  <meta name="application-name" content="Synerax Cloud Technologies" />
  <meta name="apple-mobile-web-app-title" content="Synerax" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=Inter:wght@400;500;600;700&family=Instrument+Sans:wght@400;500;600;700&family=Newsreader:ital,wght@1,400;1,500&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <meta name="theme-color" content="#0A1628">
  <script>
    /* Resolve the theme before first paint so there is no flash of the
       wrong palette. Light unless the visitor picked dark with the toggle.
       Mirrors src/hooks/useTheme.ts. */
    (function () {
      try {
        var s = localStorage.getItem('synerax-theme');
        var t = (s === 'light' || s === 'dark') ? s : 'light';
        document.documentElement.dataset.theme = t;
        document.documentElement.style.colorScheme = t;
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
