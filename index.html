<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Per-route tags. These are the homepage values; scripts/prerender.mjs
       replaces everything between the seo markers for each page at build
       time, and components/Seo.tsx keeps them current while navigating.
       Values come from src/seo.ts. -->
  <!--seo:start-->
  <title>Synerax Cloud Technologies — Cloud, AI &amp; Enterprise Engineering</title>
  <meta name="description" content="Synerax engineers cloud platforms, agentic AI, contact centers and enterprise applications — from code to cloud, engineered to last." />
  <link rel="canonical" href="https://www.synerax.in/" />
  <meta property="og:site_name" content="Synerax Cloud Technologies" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Synerax Cloud Technologies — Cloud, AI &amp; Enterprise Engineering" />
  <meta property="og:description" content="Synerax engineers cloud platforms, agentic AI, contact centers and enterprise applications — from code to cloud, engineered to last." />
  <meta property="og:url" content="https://www.synerax.in/" />
  <meta property="og:image" content="https://www.synerax.in/icons/icon-512.png" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Synerax Cloud Technologies — Cloud, AI &amp; Enterprise Engineering" />
  <meta name="twitter:description" content="Synerax engineers cloud platforms, agentic AI, contact centers and enterprise applications — from code to cloud, engineered to last." />
  <meta name="twitter:image" content="https://www.synerax.in/icons/icon-512.png" />
  <!--seo:end-->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "name": "Synerax Cloud Technologies",
          "alternateName": "Synerax",
          "url": "https://www.synerax.in/"
        },
        {
          "@type": "Organization",
          "name": "Synerax Cloud Technologies",
          "url": "https://www.synerax.in/",
          "logo": "https://www.synerax.in/icons/icon-512.png"
        }
      ]
    }
  </script>
  <!-- Favicon: the team's light- and dark-mode files, used as supplied. The browser
       picks one by its colour scheme; the first link is the fallback for browsers
       that ignore `media` on icons. -->
  <link rel="icon" type="image/png" href="https://res.cloudinary.com/dtg3lepr4/image/upload/v1793255810/file_000000003248820a89cfbef7459b0960_wz01du.png" />
  <link rel="icon" type="image/png" media="(prefers-color-scheme: light)" href="https://res.cloudinary.com/dtg3lepr4/image/upload/v1793255810/file_000000003248820a89cfbef7459b0960_wz01du.png" />
  <link rel="icon" type="image/png" media="(prefers-color-scheme: dark)" href="https://res.cloudinary.com/dtg3lepr4/image/upload/v1793255865/file_0000000028e8820aaf22089b4207df3b-removebg-preview_m6j9dh.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
  <!-- Web app metadata: name, colours and install icons (public/manifest.json) -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="application-name" content="Synerax Cloud Technologies" />
  <meta name="apple-mobile-web-app-title" content="Synerax" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <meta name="theme-color" content="#ffffff">
  <script>
    /* The site is light-only. Set the theme before first paint, and clear
       the choice saved by the old dark-mode toggle so returning visitors
       who picked dark are not left on it. */
    (function () {
      document.documentElement.dataset.theme = 'light';
      document.documentElement.style.colorScheme = 'light';
      try { localStorage.removeItem('synerax-theme'); } catch (e) { /* ignore */ }
    })();
    /* On a visit where the intro loader will play (first page of the session,
       motion allowed — mirrors shouldShow() in SiteLoader.tsx), keep the
       prerendered page hidden until the loader mounts and removes the class,
       so the page does not flash first. The timeout is a safety net in case
       the app never starts. */
    (function () {
      try {
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        if (sessionStorage.getItem('synerax-loader-seen')) return;
      } catch (e) { /* storage blocked — the loader still plays */ }
      var html = document.documentElement;
      html.classList.add('sx-preload');
      setTimeout(function () { html.classList.remove('sx-preload'); }, 6000);
    })();
  </script>
  <style>html.sx-preload #root { visibility: hidden; }</style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
